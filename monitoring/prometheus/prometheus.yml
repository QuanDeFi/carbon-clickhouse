global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: carbon-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9464
        labels:
          pipeline_id: jupiter-swap-clickhouse
          decoder: jupiter-swap
          datasource: rpc-block-crawler
          mode: dev
      - targets:
          - localhost:9465
        labels:
          pipeline_id: token-program-clickhouse
          decoder: token-program
          datasource: rpc-get-multiple-accounts
          mode: dev
