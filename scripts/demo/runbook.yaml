title: Carbon ClickHouse Sink Tutorial
resolution: 1920x1080
fps: 60
env_file: .env.demo.local
output_dir: demo-artifacts

scenes:
  - id: scene-01-readiness-checks
    title: Local readiness checks
    type: terminal
    script: docs/tutorial-video/scene-01-readiness-checks.md
    human:
      type: terminal
      terminal_name: setup-check
      terminal_title: Carbon ClickHouse - Readiness Checks
      reuse_terminal: true
      min_duration: 23
      scene_end_pause: 3.4
      steps:
        - command: docker ps
          pause_after: 8.0
        - command: curl -fsS localhost:8123/ping
          pause_after: 0.4
        - command: curl -fsS localhost:9090/-/ready
          pause_after: 0.4
        - command: curl -fsS localhost:3000/api/health
          pause_after: 1.2
        - command: >-
            curl -fsS "$RPC_URL"
            -H 'content-type:application/json'
            -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          pause_after: 1.0

  - id: scene-02-example-env
    title: Example environment files
    type: voice_only
    script: docs/tutorial-video/scene-02-example-env.md
    human:
      type: vscode
      min_duration: 52
      initial_pause: 1.0
      scene_end_pause: 0.2
      steps:
        - file: examples/jupiter-swap-clickhouse/.env.example
          line: 1
          pause_after: 6.0
        - file: examples/jupiter-swap-clickhouse/.env.example
          line: 20
          uncomment_and_set_true: true
          pause_before_edit: 0.7
          pause_after_edit: 0.5
          pause_after: 8.0
        - file: examples/token-program-clickhouse/.env.example
          line: 1
          pause_after: 5.5
        - file: examples/token-program-clickhouse/.env.example
          line: 11
          uncomment_and_set_true: true
          pause_before_edit: 0.7
          pause_after_edit: 0.5
          pause_after: 8.7
        - file: examples/token-program-clickhouse/src/main.rs
          line: 154
          pause_after: 4.5
        - file: crates/core/src/clickhouse/config.rs
          line: 102
          pause_after: 4.0

  - id: scene-03-jupiter-live
    title: Start Jupiter example run
    type: terminal
    script: docs/tutorial-video/scene-03-jupiter-live.md
    command: cargo run -p jupiter-swap-clickhouse-carbon-example
    human:
      type: terminal
      terminal_name: jupiter-live
      terminal_title: Carbon ClickHouse - Local Services And Jupiter Live
      reuse_terminal: true
      keep_open: true
      env:
        BLOCK_CRAWLER_START_SLOT: ""
        BLOCK_CRAWLER_END_SLOT: ""
        CLICKHOUSE_ASYNC_INSERT: "true"
      min_duration: 39.3
      scene_end_pause: 1.2
      steps:
        - command: cargo run -p jupiter-swap-clickhouse-carbon-example
          wait_for_prompt: false
          pause_after: 16.8

  - id: scene-04-token-live
    title: Start Token Program live run
    type: terminal
    script: docs/tutorial-video/scene-04-token-live.md
    command: cargo run -p token-program-clickhouse-carbon-example
    human:
      type: terminal
      terminal_name: token-live
      terminal_title: Carbon ClickHouse - Token Program Live
      reuse_terminal: true
      keep_open: true
      env:
        CLICKHOUSE_ASYNC_INSERT: "true"
      min_duration: 29.8
      scene_end_pause: 1.2
      steps:
        - command: cargo run -p token-program-clickhouse-carbon-example
          wait_for_prompt: false
          pause_after: 20.0

  - id: scene-05-observability
    title: Live observability
    type: browser
    script: docs/tutorial-video/scene-05-observability.md
    command: scripts/demo/query-clickhouse.sh token
    human:
      type: browser
      workflow: live-observability
      min_duration: 51.9

  - id: scene-06-clickhouse-play
    title: Landing table inspection
    type: browser
    script: docs/tutorial-video/scene-06-clickhouse-play.md
    command: scripts/demo/query-clickhouse.sh landing-validation
    human:
      type: browser
      workflow: table-inspection
      min_duration: 70
