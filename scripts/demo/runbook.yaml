title: Carbon ClickHouse Sink Tutorial
resolution: 1920x1080
fps: 60
env_file: .env.demo.local
output_dir: demo-artifacts

scenes:
  - id: scene-01-intro
    title: Intro and architecture
    type: voice_only
    script: docs/tutorial-video/scene-01-intro.md
    human:
      type: slide
      slide: docs/tutorial-video/slides/scene-01-intro.html
      duration: 6
      min_duration: 5

  - id: scene-02-local-setup
    title: Local setup
    type: terminal
    script: docs/tutorial-video/scene-02-local-setup.md
    command: scripts/demo/setup-monitoring.sh
    human:
      type: terminal
      terminal_name: jupiter-live
      terminal_title: Carbon ClickHouse - Local Services And Jupiter Live
      reuse_terminal: true
      min_duration: 12
      scene_end_pause: 2.0
      steps:
        - command: docker compose -f monitoring/compose.yaml ps
          pause_after: 3.0
        - command: curl -fsS 'http://carbon:carbon@localhost:8123/?query=SELECT%201'
          pause_after: 1.5
        - command: curl -fsS http://localhost:9090/-/ready
          pause_after: 1.5
        - command: curl -fsS http://localhost:3000/api/health
          pause_after: 2.0

  - id: scene-03-jupiter-ingestion
    title: Start Jupiter live ingestion
    type: terminal
    script: docs/tutorial-video/scene-03-jupiter-ingestion.md
    command: LOG_LEVEL=debug BLOCK_CRAWLER_START_SLOT= BLOCK_CRAWLER_END_SLOT= cargo run -p jupiter-swap-clickhouse-carbon-example
    human:
      type: terminal
      terminal_name: jupiter-live
      terminal_title: Carbon ClickHouse - Local Services And Jupiter Live
      reuse_terminal: true
      keep_open: true
      min_duration: 18
      scene_end_pause: 2.5
      steps:
        - command: LOG_LEVEL=debug BLOCK_CRAWLER_START_SLOT= BLOCK_CRAWLER_END_SLOT= cargo run -p jupiter-swap-clickhouse-carbon-example
          wait_for_prompt: false
          pause_after: 12.0

  - id: scene-04-clickhouse-validation
    title: Start Token Program live ingestion
    type: terminal
    script: docs/tutorial-video/scene-04-clickhouse-validation.md
    command: LOG_LEVEL=debug PROMETHEUS_METRICS_ADDR=0.0.0.0:9465 cargo run -p token-program-clickhouse-carbon-example
    human:
      type: terminal
      terminal_name: token-live
      terminal_title: Carbon ClickHouse - Token Program Live
      reuse_terminal: true
      keep_open: true
      min_duration: 18
      scene_end_pause: 2.5
      steps:
        - command: LOG_LEVEL=debug PROMETHEUS_METRICS_ADDR=0.0.0.0:9465 cargo run -p token-program-clickhouse-carbon-example
          wait_for_prompt: false
          pause_after: 13.0

  - id: scene-05-token-program
    title: Live Carbon and ClickHouse observability
    type: browser
    script: docs/tutorial-video/scene-05-token-program.md
    command: scripts/demo/query-clickhouse.sh token
    human:
      type: browser
      workflow: live-observability
      min_duration: 36

  - id: scene-06-async-inserts
    title: ClickHouse table data inspection
    type: browser
    script: docs/tutorial-video/scene-06-async-inserts.md
    command: scripts/demo/query-clickhouse.sh jupiter && scripts/demo/query-clickhouse.sh token
    human:
      type: browser
      workflow: table-inspection
      min_duration: 36

  - id: scene-07-observability
    title: Async-wait inserts and async insert log
    type: browser
    script: docs/tutorial-video/scene-07-observability.md
    playwright:
      - scripts/demo/playwright/prometheus.spec.ts
      - scripts/demo/playwright/grafana.spec.ts
    human:
      type: mixed_async
      terminal_name: async-inserts
      terminal_title: Carbon ClickHouse - Async Wait Inserts
      reuse_terminal: true
      workflow: async-log
      min_duration: 34
      scene_end_pause: 2.0
      steps:
        - command: grep -rnE "async_insert|wait_for_async_insert" crates/core/src/clickhouse | head
          pause_after: 1.0
        - command: CLICKHOUSE_ASYNC_INSERT=true PROMETHEUS_METRICS_ADDR=0.0.0.0:9466 timeout --signal=INT 5s cargo run -p token-program-clickhouse-carbon-example
          pause_after: 6.0

  - id: scene-08-production-boundaries
    title: Production boundaries
    type: voice_only
    script: docs/tutorial-video/scene-08-production-boundaries.md
    human:
      type: slide
      slide: docs/tutorial-video/slides/scene-08-production-boundaries.html
      duration: 7
      min_duration: 6
      cleanup_live_terminals_after_seconds: 2
