title: Carbon ClickHouse Sink Tutorial
resolution: 1920x1080
fps: 30
env_file: .env.demo.local
output_dir: demo-artifacts

scenes:
  - id: scene-01-intro
    title: Intro and architecture
    type: voice_only
    script: docs/tutorial-video/scene-01-intro.md
    human:
      type: slide
      slide: docs/tutorial-video/slides/scene-01-intro.html
      duration: 6
      min_duration: 5

  - id: scene-02-local-setup
    title: Local setup
    type: terminal
    script: docs/tutorial-video/scene-02-local-setup.md
    command: scripts/demo/setup-monitoring.sh
    human:
      type: terminal
      min_duration: 12
      scene_end_pause: 2.0
      steps:
        - command: docker compose -f monitoring/compose.yaml ps
          pause_after: 3.0
        - command: curl -fsS 'http://carbon:carbon@localhost:8123/?query=SELECT%201'
          pause_after: 1.5
        - command: curl -fsS http://localhost:9090/-/ready
          pause_after: 1.5
        - command: curl -fsS http://localhost:3000/api/health
          pause_after: 2.0

  - id: scene-03-jupiter-ingestion
    title: Jupiter instruction and CPI/event ingestion
    type: terminal
    script: docs/tutorial-video/scene-03-jupiter-ingestion.md
    command: scripts/demo/run-jupiter-bounded.sh
    human:
      type: terminal
      min_duration: 24
      scene_end_pause: 4.0
      steps:
        - command: cargo run -p jupiter-swap-clickhouse-carbon-example
          pause_after: 11.0

  - id: scene-04-clickhouse-validation
    title: ClickHouse SQL validation
    type: terminal
    script: docs/tutorial-video/scene-04-clickhouse-validation.md
    command: scripts/demo/query-clickhouse.sh jupiter
    human:
      type: terminal
      min_duration: 22
      scene_end_pause: 4.0
      steps:
        - command: docker exec clickhouse clickhouse-client --query "SHOW TABLES LIKE 'jupiter_swap_%landing'"
          pause_after: 3.0
        - command: docker exec clickhouse clickhouse-client --query "SELECT count() rows, uniq(signature) signatures FROM jupiter_swap_route_instruction_landing FORMAT PrettyCompact"
          pause_after: 4.0
        - command: docker exec clickhouse clickhouse-client --query "SELECT in_amount, quoted_out_amount, length(route_plan) legs FROM jupiter_swap_route_instruction_landing LIMIT 3 FORMAT PrettyCompact"
          pause_after: 5.0
        - command: docker exec clickhouse clickhouse-client --query "SELECT amm, input_amount, output_amount FROM jupiter_swap_swap_event_landing LIMIT 5 FORMAT PrettyCompact"
          pause_after: 5.0

  - id: scene-05-token-program
    title: Token Program account snapshot
    type: terminal
    script: docs/tutorial-video/scene-05-token-program.md
    command: scripts/demo/run-token-snapshot.sh
    human:
      type: terminal
      min_duration: 18
      scene_end_pause: 4.0
      steps:
        - command: PROMETHEUS_METRICS_ADDR=0.0.0.0:9465 cargo run -p token-program-clickhouse-carbon-example
          pause_after: 7.0
        - command: docker exec clickhouse clickhouse-client --query "SHOW TABLES LIKE 'token_program_%account_landing'"
          pause_after: 2.5
        - command: docker exec clickhouse clickhouse-client --query "SELECT count() rows, uniq(pubkey) accounts, min(slot) min_slot, max(slot) max_slot FROM token_program_token_account_landing FORMAT PrettyCompact"
          pause_after: 4.0
        - command: docker exec clickhouse clickhouse-client --query "SELECT left(pubkey,8) account, left(mint,8) mint, amount, state FROM token_program_token_account_landing LIMIT 3 FORMAT PrettyCompact"
          pause_after: 5.0

  - id: scene-06-async-inserts
    title: Async-wait inserts
    type: terminal
    script: docs/tutorial-video/scene-06-async-inserts.md
    command: scripts/demo/query-clickhouse.sh async-log
    human:
      type: terminal
      min_duration: 16
      scene_end_pause: 2.5
      steps:
        - command: rg -n "CLICKHOUSE_ASYNC_INSERT|async_insert|wait_for_async_insert" crates/core/src/clickhouse examples
          pause_after: 2.5
        - command: export CLICKHOUSE_ASYNC_INSERT=true
          pause_after: 0.7
        - command: PROMETHEUS_METRICS_ADDR=0.0.0.0:9465 cargo run -p token-program-clickhouse-carbon-example
          pause_after: 6.0
        - command: docker exec clickhouse clickhouse-client --query "SYSTEM FLUSH LOGS"
          pause_after: 1.0
        - command: docker exec clickhouse clickhouse-client --query "SELECT table, rows, bytes, status FROM system.asynchronous_insert_log ORDER BY event_time DESC LIMIT 5 FORMAT PrettyCompact"
          pause_after: 4.0

  - id: scene-07-observability
    title: Prometheus and Grafana observability
    type: browser
    script: docs/tutorial-video/scene-07-observability.md
    playwright:
      - scripts/demo/playwright/prometheus.spec.ts
      - scripts/demo/playwright/grafana.spec.ts
    human:
      type: browser
      min_duration: 12
      prometheus_only: true
      reason: Grafana is skipped in the human rehearsal unless local admin credentials are verified.
      playwright: scripts/demo/playwright/human-observability.spec.ts

  - id: scene-08-production-boundaries
    title: Production boundaries
    type: voice_only
    script: docs/tutorial-video/scene-08-production-boundaries.md
    human:
      type: slide
      slide: docs/tutorial-video/slides/scene-08-production-boundaries.html
      duration: 7
      min_duration: 6
